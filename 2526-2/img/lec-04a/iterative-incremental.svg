<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="340" fill="#fafafa"/>
  <text x="240" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1565C0">Lặp (Iterative)</text>
  <text x="720" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#E65100">Tăng trưởng (Incremental)</text>
  <!-- left: refine same thing -->
  <circle cx="240" cy="160" r="90" fill="none" stroke="#90caf9" stroke-width="18"/>
  <circle cx="240" cy="160" r="55" fill="none" stroke="#42a5f5" stroke-width="14"/>
  <circle cx="240" cy="160" r="28" fill="#1565C0"/>
  <text x="240" y="280" text-anchor="middle" font-size="14" fill="#444">Làm lại / tinh chỉnh cùng một phần</text>
  <text x="240" y="302" text-anchor="middle" font-size="13" fill="#666">qua nhiều vòng feedback</text>
  <!-- right: grow slices -->
  <rect x="580" y="220" width="280" height="36" rx="4" fill="#ffe0b2"/>
  <rect x="580" y="170" width="200" height="36" rx="4" fill="#ffcc80"/>
  <rect x="580" y="120" width="130" height="36" rx="4" fill="#ffb74d"/>
  <rect x="580" y="70" width="70" height="36" rx="4" fill="#E65100"/>
  <text x="870" y="95" font-size="12" fill="#E65100">v4</text>
  <text x="870" y="145" font-size="12" fill="#E65100">v3</text>
  <text x="870" y="195" font-size="12" fill="#E65100">v2</text>
  <text x="870" y="245" font-size="12" fill="#E65100">v1</text>
  <text x="720" y="290" text-anchor="middle" font-size="14" fill="#444">Mỗi lần thêm một lát chức năng mới</text>
  <text x="720" y="312" text-anchor="middle" font-size="13" fill="#666">hệ thống lớn dần theo thời gian</text>
</svg>
