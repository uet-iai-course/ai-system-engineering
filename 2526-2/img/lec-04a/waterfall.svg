  <rect x="205" y="98" width="150" height="52" rx="8" fill="#bbdefb" stroke="#1565C0" stroke-width="2"/>
  <text x="280" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">Thiết kế</text>
