<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="340" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#333">Extreme Programming — một số thực hành kỹ thuật</text>
  <rect x="40" y="70" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#1565C0">Pair Programming</text>
  <rect x="260" y="70" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#2E7D32">TDD</text>
  <rect x="480" y="70" width="200" height="70" rx="10" fill="#fff3e0" stroke="#E65100" stroke-width="2"/>
  <text x="580" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#E65100">Continuous Integration</text>
  <rect x="700" y="70" width="200" height="70" rx="10" fill="#fce4ec" stroke="#AD1457" stroke-width="2"/>
  <text x="800" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#AD1457">Refactoring</text>
  <rect x="40" y="170" width="200" height="70" rx="10" fill="#ede7f6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="140" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#6A1B9A">Simple Design</text>
  <rect x="260" y="170" width="200" height="70" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#00838f">Collective Ownership</text>
  <rect x="480" y="170" width="200" height="70" rx="10" fill="#fff8e1" stroke="#F9A825" stroke-width="2"/>
  <text x="580" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#F9A825">Customer Tests</text>
  <rect x="700" y="170" width="200" height="70" rx="10" fill="#efebe9" stroke="#5D4037" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#5D4037">Small Releases</text>

  <text x="460" y="290" text-anchor="middle" font-size="14" fill="#444">XP nhấn mạnh <tspan font-weight="700" fill="#E62727">thực hành kỹ thuật</tspan> để đáp ứng thay đổi nhanh.</text>
  <text x="460" y="318" text-anchor="middle" font-size="12" fill="#888">Kent Beck, Extreme Programming Explained</text>
</svg>
