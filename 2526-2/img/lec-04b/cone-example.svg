<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="420" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#333">Ví dụ: "Chatbot hỗ trợ khách hàng — ước 4 tháng"</text>
  <!-- stages -->
  <rect x="40" y="60" width="200" height="200" rx="12" fill="#ffebee" stroke="#E62727" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#E62727">Ý tưởng ban đầu</text>
  <text x="140" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#E62727">×4</text>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="#444">Khoảng ước:</text>
  <text x="140" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#333">1 – 16 tháng</text>
  <text x="140" y="225" text-anchor="middle" font-size="12" fill="#888">chưa rõ data / scope</text>

  <text x="260" y="165" font-size="22" fill="#90a4ae">→</text>

  <rect x="290" y="60" width="200" height="200" rx="12" fill="#fff3e0" stroke="#E65100" stroke-width="2"/>
  <text x="390" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#E65100">Sau khi chốt yêu cầu</text>
  <text x="390" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#E65100">×2</text>
  <text x="390" y="165" text-anchor="middle" font-size="13" fill="#444">Khoảng ước:</text>
  <text x="390" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#333">2 – 8 tháng</text>
  <text x="390" y="225" text-anchor="middle" font-size="12" fill="#888">đã có use case + NFR</text>

  <text x="510" y="165" font-size="22" fill="#90a4ae">→</text>

  <rect x="540" y="60" width="200" height="200" rx="12" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">Sau prototype</text>
  <text x="640" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#2E7D32">×1.25</text>
  <text x="640" y="165" text-anchor="middle" font-size="13" fill="#444">Khoảng ước:</text>
  <text x="640" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#333">3.2 – 5 tháng</text>
  <text x="640" y="225" text-anchor="middle" font-size="12" fill="#888">đã thử model + API</text>

  <text x="760" y="165" font-size="22" fill="#90a4ae">→</text>

  <rect x="790" y="60" width="140" height="200" rx="12" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="860" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">Gần xong</text>
  <text x="860" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#1565C0">~4</text>
  <text x="860" y="185" text-anchor="middle" font-size="13" fill="#444">tháng</text>
  <text x="860" y="225" text-anchor="middle" font-size="12" fill="#888">sai số nhỏ</text>

  <rect x="80" y="300" width="800" height="90" rx="10" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text x="480" y="340" text-anchor="middle" font-size="15" fill="#333">Cam kết "đúng 4 tháng" ngay ngày 1 là <tspan font-weight="700" fill="#E62727">không trung thực</tspan> theo Cone.</text>
  <text x="480" y="370" text-anchor="middle" font-size="13" fill="#666">Nên nói khoảng + điều kiện thu hẹp (yêu cầu rõ, prototype, rủi ro data đã giảm).</text>
</svg>
