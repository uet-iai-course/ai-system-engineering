<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" fill="#fafafa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#333">Kubernetes mental model (đủ để Lab 8)</text>
  <rect x="40" y="70" width="220" height="160" rx="12" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1565C0">Control plane</text>
  <text x="150" y="145" text-anchor="middle" font-size="13" fill="#333">API Server</text>
  <text x="150" y="170" text-anchor="middle" font-size="13" fill="#333">Scheduler</text>
  <text x="150" y="195" text-anchor="middle" font-size="13" fill="#333">Controllers</text>
  <text x="280" y="150" font-size="28" fill="#90a4ae">→</text>
  <rect x="320" y="70" width="200" height="160" rx="12" fill="#fff3e0" stroke="#E65100" stroke-width="2"/>
  <text x="420" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#E65100">Pod</text>
  <text x="420" y="145" text-anchor="middle" font-size="13" fill="#333">1+ container</text>
  <text x="420" y="170" text-anchor="middle" font-size="13" fill="#333">requests / limits</text>
  <text x="420" y="195" text-anchor="middle" font-size="13" fill="#333">đơn vị lập lịch</text>
  <text x="540" y="150" font-size="28" fill="#90a4ae">→</text>
  <rect x="580" y="55" width="160" height="90" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">Node A</text>
  <text x="660" y="118" text-anchor="middle" font-size="12" fill="#444">2 GPU trống</text>
  <rect x="580" y="160" width="160" height="90" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <text x="660" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">Node B</text>
  <text x="660" y="223" text-anchor="middle" font-size="12" fill="#444">CPU/RAM còn</text>
  <rect x="760" y="100" width="160" height="110" rx="10" fill="#f3e5f5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="840" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#6A1B9A">Service</text>
  <text x="840" y="175" text-anchor="middle" font-size="12" fill="#444">DNS + LB nội bộ</text>
  <rect x="80" y="270" width="800" height="90" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="480" y="305" text-anchor="middle" font-size="14" fill="#333">Scheduler đặt Pod lên Node còn đủ tài nguyên theo <tspan font-weight="700">requests</tspan>.</text>
  <text x="480" y="335" text-anchor="middle" font-size="14" fill="#333"><tspan font-weight="700">limits</tspan> chặn Pod ăn quá quota. Service định tuyến tới các replica.</text>
</svg>