<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="430" fill="#fafafa"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#333">Project Compose → lớp hạ tầng production</text>
  <text x="80" y="70" font-size="14" font-weight="700" fill="#555">Service local</text>
  <text x="360" y="70" font-size="14" font-weight="700" fill="#555">Lớp hạ tầng</text>
  <text x="620" y="70" font-size="14" font-weight="700" fill="#555">Chỉ tiêu nó phục vụ</text>
  <g font-size="13">
    <rect x="40" y="90" width="900" height="40" fill="#e3f2fd"/><text x="60" y="115" fill="#1565C0" font-weight="700">nginx</text><text x="280" y="115" fill="#333">cổng vào / reverse proxy</text><text x="620" y="115" fill="#444">availability, TLS, routing</text>
    <rect x="40" y="130" width="900" height="40" fill="#fff"/><text x="60" y="155" fill="#1565C0" font-weight="700">app</text><text x="280" y="155" fill="#333">compute ứng dụng + AI call</text><text x="620" y="155" fill="#444">latency, throughput</text>
    <rect x="40" y="170" width="900" height="40" fill="#e8f5e9"/><text x="60" y="195" fill="#2E7D32" font-weight="700">db (Postgres)</text><text x="280" y="195" fill="#333">storage trạng thái</text><text x="620" y="195" fill="#444">durability, consistency</text>
    <rect x="40" y="210" width="900" height="40" fill="#fff"/><text x="60" y="235" fill="#2E7D32" font-weight="700">redis</text><text x="280" y="235" fill="#333">cache / idempotency</text><text x="620" y="235" fill="#444">latency thấp</text>
    <rect x="40" y="250" width="900" height="40" fill="#fff3e0"/><text x="60" y="275" fill="#E65100" font-weight="700">minio</text><text x="280" y="275" fill="#333">object storage</text><text x="620" y="275" fill="#444">lưu ảnh/artifact rẻ</text>
    <rect x="40" y="290" width="900" height="40" fill="#fff"/><text x="60" y="315" fill="#E65100" font-weight="700">milvus</text><text x="280" y="315" fill="#333">vector storage + search</text><text x="620" y="315" fill="#444">recall + query latency</text>
    <rect x="40" y="330" width="900" height="40" fill="#f3e5f5"/><text x="60" y="355" fill="#6A1B9A" font-weight="700">rabbitmq</text><text x="280" y="355" fill="#333">hàng đợi / điều phối job</text><text x="620" y="355" fill="#444">decouple, peak load</text>
  </g>
  <text x="490" y="405" text-anchor="middle" font-size="14" fill="#333">Compose tái hiện môi trường. Production thêm: quota GPU, autoscaling, SLO, quan sát, backup.</text>
</svg>