<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" fill="#fafafa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#333">Chỉ tiêu chất lượng khi chọn hạ tầng AI</text>
  <g font-size="14">
    <rect x="50" y="70" width="200" height="90" rx="10" fill="#e3f2fd" stroke="#1565C0"/>
    <text x="150" y="108" text-anchor="middle" font-weight="700" fill="#1565C0">Latency</text>
    <text x="150" y="135" text-anchor="middle" fill="#444">p50 / p95 / p99</text>
    <rect x="270" y="70" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#2E7D32"/>
    <text x="370" y="108" text-anchor="middle" font-weight="700" fill="#2E7D32">Throughput</text>
    <text x="370" y="135" text-anchor="middle" fill="#444">req/s hoặc token/s</text>
    <rect x="490" y="70" width="200" height="90" rx="10" fill="#fff3e0" stroke="#E65100"/>
    <text x="590" y="108" text-anchor="middle" font-weight="700" fill="#E65100">Availability</text>
    <text x="590" y="135" text-anchor="middle" fill="#444">uptime, error rate</text>
    <rect x="710" y="70" width="200" height="90" rx="10" fill="#fce4ec" stroke="#C2185B"/>
    <text x="810" y="108" text-anchor="middle" font-weight="700" fill="#C2185B">Cost</text>
    <text x="810" y="135" text-anchor="middle" fill="#444">$/1k req, GPU-hour</text>
    <rect x="160" y="190" width="200" height="90" rx="10" fill="#f3e5f5" stroke="#6A1B9A"/>
    <text x="260" y="228" text-anchor="middle" font-weight="700" fill="#6A1B9A">Privacy</text>
    <text x="260" y="255" text-anchor="middle" fill="#444">data rời máy?</text>
    <rect x="380" y="190" width="200" height="90" rx="10" fill="#e0f2f1" stroke="#00695C"/>
    <text x="480" y="228" text-anchor="middle" font-weight="700" fill="#00695C">Energy</text>
    <text x="480" y="255" text-anchor="middle" fill="#444">Wh / inference</text>
    <rect x="600" y="190" width="200" height="90" rx="10" fill="#efebe9" stroke="#5D4037"/>
    <text x="700" y="228" text-anchor="middle" font-weight="700" fill="#5D4037">Update speed</text>
    <text x="700" y="255" text-anchor="middle" fill="#444">time-to-deploy</text>
  </g>
  <text x="480" y="340" text-anchor="middle" font-size="15" fill="#333">Accuracy model là cần nhưng không đủ — hạ tầng phải đạt các chỉ tiêu vận hành.</text>
  <text x="480" y="375" text-anchor="middle" font-size="14" fill="#666">Trước khi chọn GPU/cloud: viết 3–5 chỉ tiêu đo được (vd: p95 &lt; 800ms, cost &lt; $0.002/req).</text>
</svg>