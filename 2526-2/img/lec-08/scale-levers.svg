<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="360" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#333">Ba đòn bẩy scale compute</text>
  <rect x="40" y="70" width="270" height="220" rx="12" fill="#e3f2fd" stroke="#1565C0" stroke-width="2"/>
  <text x="175" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#1565C0">1. Thuật toán</text>
  <text x="175" y="150" text-anchor="middle" font-size="13" fill="#333">quantize INT8</text>
  <text x="175" y="180" text-anchor="middle" font-size="13" fill="#333">distillation</text>
  <text x="175" y="210" text-anchor="middle" font-size="13" fill="#333">batching thông minh</text>
  <text x="175" y="250" text-anchor="middle" font-size="12" fill="#555">rẻ nhất nếu đủ chất lượng</text>
  <rect x="335" y="70" width="270" height="220" rx="12" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
  <text x="470" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#2E7D32">2. Máy mạnh hơn</text>
  <text x="470" y="150" text-anchor="middle" font-size="13" fill="#333">CPU → GPU → H100</text>
  <text x="470" y="180" text-anchor="middle" font-size="13" fill="#333">nhiều VRAM hơn</text>
  <text x="470" y="210" text-anchor="middle" font-size="13" fill="#333">NVMe nhanh hơn</text>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#555">dễ làm, đắt nhanh</text>
  <rect x="630" y="70" width="270" height="220" rx="12" fill="#fff3e0" stroke="#E65100" stroke-width="2"/>
  <text x="765" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#E65100">3. Nhiều máy hơn</text>
  <text x="765" y="150" text-anchor="middle" font-size="13" fill="#333">replica serving</text>
  <text x="765" y="180" text-anchor="middle" font-size="13" fill="#333">data/model parallel</text>
  <text x="765" y="210" text-anchor="middle" font-size="13" fill="#333">queue + worker</text>
  <text x="765" y="250" text-anchor="middle" font-size="12" fill="#555">cần orchestration</text>
  <text x="470" y="330" text-anchor="middle" font-size="14" fill="#444">Thứ tự thực dụng: tối ưu thuật toán → chọn máy đủ mạnh → mới nhân bản khi đo được nghẽn.</text>
</svg>